[project]
name = "simosphere-ai-copilot-mini"
version = "0.1.2"
description = "Free, self-contained Nextcloud documentation assistant (RAG) — the little sibling of SIMOSphere AI Copilot."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "SIMO GmbH" }]
dependencies = [
    "nc_py_api>=0.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Das Frontend (static/) MUSS mit ins installierte Paket — sonst ist site-packages/copilot_mini/static
# nicht vorhanden, der ``if _STATIC.is_dir()``-Guard in app.py bleibt False und die App liefert ihre
# eigenen Assets als 404. (data/ liegt ausserhalb des Pakets und wird im Image separat nach /app/data
# kopiert, siehe Dockerfile + COPILOT_MINI_DATA.)
[tool.setuptools.package-data]
copilot_mini = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: FastAPI nutzt ``Depends(...)`` bewusst als Argument-Default — kein Bug, sondern das Framework-Idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

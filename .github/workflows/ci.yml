name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # CPU-only torch first so sentence-transformers doesn't pull the CUDA wheels.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      # Cache the embedding model between runs (first run downloads ~2.2 GB).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-large-v1
      # Modell online in den Cache holen (safetensors), BEVOR die Tests laufen — retrieval.py
      # erzwingt zur Laufzeit HF_HUB_OFFLINE=1, findet es dann im Cache. Ab dem 2. Lauf aus dem Cache.
      - name: Prefetch embedding model
        run: >-
          python -c "from huggingface_hub import snapshot_download;
          snapshot_download('intfloat/multilingual-e5-large',
          ignore_patterns=['*.bin','*.h5','*.onnx','*.msgpack','*.ot','tf_model*','flax_model*','rust_model*','onnx/*','openvino/*'])"
      - name: Run tests
        run: pytest -q
